# Configuration options
set -g mouse on
setw -g mode-keys vi
set -g display-time 4000
set -g default-terminal "screen-256color"

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Open panes in current working directory (CWD)
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# NOTE: Press prefix + I to clone the remaining plugins through TPM
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux themes & icons
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# apply catppuccin theme for tmux
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha

# catppuccin/tmux theme configuration options
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_session}"

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"

set -g @catppuccin_directory_text " #{pane_current_path}"

# force transparent background on the status bar
set -g status-bg default
set -g status-style fg=default,bg=default 
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'
set -g @catppuccin_status_background "default"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm'
