# 1. GENERAL SETTINGS

# Enable true color support for the terminal inside tmux
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm*:Tc"

# Enable mouse support
set -g mouse on

# Set duration for status messages (in milliseconds)
set -g display-time 4000

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatically renumber windows when one is closed
set-option -g renumber-windows on

# 2. KEY BINDINGS & VI MODE

# Reload tmux configuration with Prefix + r
unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# Enable Vim keybindings in copy mode
setw -g mode-keys vi

# Vim-style copy mode selection and navigation bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open new panes in the current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# 3. APPEARANCE

# Position status bar at the top
set-option -g status-position top
set -g status on

# Force transparent backgrounds for windows and status bar
set -g status-bg terminal
set -g status-style fg=default,bg=terminal
set -g window-style 'fg=default,bg=terminal'
set -g window-active-style 'fg=default,bg=terminal'

# 4. PLUGINS (TPM)

# NOTE: Press Prefix + I to install added plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'catppuccin/tmux'

# 5. THEME CONFIGURATION (CATPPUCCIN)

# Set theme flavor (latte, frappe, macchiato, mocha)
set -g @catppuccin_flavor 'mocha'

# Status bar structure
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_session}"

# Directory format configuration
set -g @catppuccin_directory_text " #{pane_current_path}"

# Window status styling
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Status bar fill style and transparency
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_background "none"

# Reduce spacing between window elements
set -gF window-status-separator ""

# 6. PLUGIN MANAGER INITIALIZATION

# Initialize TPM (Keep this line at the absolute bottom)
run -b '$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm'
